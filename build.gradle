/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.spring.io/libs-release')
    }

    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

configurations.all {
    exclude(group: 'commons-logging', module: 'commons-logging')
}

dependencies {
    api libs.org.springframework.spring.context
    api libs.org.springframework.spring.beans
    api libs.org.springframework.spring.core
    api libs.org.springframework.spring.aop
    api libs.org.springframework.spring.webmvc
    api libs.org.springframework.spring.web
    api libs.javax.servlet.jstl
    api libs.taglibs.standard
    api libs.cglib.cglib
    api libs.org.mybatis.mybatis
    api libs.org.mybatis.mybatis.spring
    api libs.org.springframework.spring.jdbc
    api libs.org.apache.httpcomponents.httpclient
    api libs.org.json.json
    api libs.ch.qos.logback.logback.classic
    api libs.org.apache.tiles.tiles.extras
    api libs.org.apache.tiles.tiles.servlet
    api libs.org.apache.tiles.tiles.jsp
    api libs.slf4j
    testImplementation libs.junit.junit
    compileOnly libs.javax.servlet.javax.servlet.api
    compileOnly libs.javax.servlet.jsp.jsp.api
    compileOnly libs.org.projectlombok.lombok
}

group = 'com.bo'
version = '1.0-SNAPSHOT'
description = 'MJW'
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
